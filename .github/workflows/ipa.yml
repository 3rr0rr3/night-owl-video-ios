name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test game rules and launch iPhone simulator
        run: bash scripts/test-macos.sh
      - name: Compile arm64 iPhone app and package IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NightOwl-SideStore
          path: build/NightOwl.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-launch-screenshot
          path: |
            build/iPhone-launch.png
            build/iPhone-store.png
          if-no-files-found: error

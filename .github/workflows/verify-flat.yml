name: Verify restored illustrated release
on:
  push:
    paths: [.github/workflows/verify-flat.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Wait for release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN in 40372648187 40372648164; do
            for N in {1..50}; do
              STATUS=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$RUN --jq .status)
              if [ "$STATUS" = completed ]; then
                test "$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$RUN --jq .conclusion)" = success
                break
              fi
              sleep 15
            done
          done
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-character-screenshots
          path: previews
          run-id: 40372648164
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-SideStore
          path: package
          run-id: 40372648187
          github-token: ${{ github.token }}
      - name: Verify package and export screenshot
        run: |
          sips -Z 800 previews/world.png --out previews/store-small.png >/dev/null
          python3 - <<'PY'
          import zipfile,pathlib,plistlib,struct,base64
          z=zipfile.ZipFile('package/NightOwl.ipa')
          assert z.testzip() is None
          info=plistlib.loads(z.read('Payload/NightOwl.app/Info.plist'))
          b=z.read('Payload/NightOwl.app/NightOwl')
          assert struct.unpack_from('<II',b)==(0xfeedfacf,0x100000c)
          assert info['CFBundleShortVersionString']=='2.2'
          assert b'SceneKit.framework' not in b
          print('PASS: valid arm64 IPA 2.2; SceneKit removed')
          print('STORE_PNG:'+base64.b64encode(pathlib.Path('previews/store-small.png').read_bytes()).decode())
          PY

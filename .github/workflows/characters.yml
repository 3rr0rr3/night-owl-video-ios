name: Character screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - NightOwl/**
      - scripts/character-capture.py
      - scripts/capture-characters.sh
      - .github/workflows/characters.yml
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Render actual game characters in iPhone simulator
        run: bash scripts/capture-characters.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NightOwl-character-screenshots
          path: |
            build/ui-more.png
            build/ui-films.png
            build/ui-returns.png
            build/ui-shop.png
            build/ui-checkout.png
            build/ui-compact.png
            build/ui-large.png
            build/floorplan.png
            build/usedtapes.png
            build/movieclub.png
            build/gazette.png
            build/forecast.png
            build/gestures.png
            build/portrait.png
            build/library.png
            build/notebook.png
            build/equipment.png
            build/covers.png
            build/neighborhood.png
            build/chores.png
            build/slots.png
            build/menu.png
            build/world.png
            build/tutorial.png
            build/options.png
            build/styles.png
            build/summary.png
            build/newcharacters.png
            build/story.png
            build/barcode-scan.png
            build/cash-register.png
            build/rental-receipt.png
            build/living-shop.mp4
            build/living-shop.png
            build/connected-handoff.mp4
            build/store-animation.mp4
            build/characters-in-store.png
          if-no-files-found: error

name: Verify connected movie handoff
on:
  push:
    branches: [inspect-living-shop-3-1]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Wait for builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 40735436511 40735436484; do
            for attempt in {1..65}; do
              state=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$run --jq '.status' 2>/dev/null || echo retry)
              if [ "$state" = completed ]; then
                result=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$run --jq '.conclusion')
                test "$result" = success || exit 1
                break
              fi
              sleep 20
            done
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40735436511
          name: NightOwl-SideStore
          path: ipa
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40735436484
          name: NightOwl-character-screenshots
          path: previews
      - name: Verify IPA and render handoff
        run: |
          mkdir -p frames
          python3 - <<'PY'
          import zipfile, plistlib, struct
          z=zipfile.ZipFile('ipa/NightOwl.ipa')
          assert z.testzip() is None
          root='Payload/NightOwl.app/'
          info=plistlib.loads(z.read(root+'Info.plist'))
          assert info['CFBundleShortVersionString']=='4.2' and info['CFBundleVersion']=='20'
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName']=='AppIcon'
          assert root+'Assets.car' in z.namelist()
          assert struct.unpack_from('<I',z.read(root+'NightOwl'),4)[0]==0x100000c
          print('PASS: IPA CRC, arm64 executable, version 4.2 build 20 and app icon',flush=True)
          PY
          cat > frames.swift <<'SWIFT'
          import Foundation
          import AppKit
          import AVFoundation
          let asset=AVURLAsset(url:URL(fileURLWithPath:"previews/connected-handoff.mp4"))
          let gen=AVAssetImageGenerator(asset:asset)
          gen.appliesPreferredTrackTransform=true
          gen.maximumSize=CGSize(width:900,height:900)
          gen.requestedTimeToleranceBefore = .zero
          gen.requestedTimeToleranceAfter = .zero
          for (i,t) in [2.0,2.4,2.8,3.2,3.6,4.0,4.4,4.8,5.2,5.6].enumerated() {
              let full=try gen.copyCGImage(at:CMTime(seconds:t,preferredTimescale:600),actualTime:nil)
              let crop=full.cropping(to:CGRect(x:0,y:0,width:full.width,height:Int(Double(full.height)*0.59)))!
              let data=NSBitmapImageRep(cgImage:crop).representation(using:.png,properties:[:])!
              try data.write(to:URL(fileURLWithPath:"frames/handoff-\(i).png"))
              print("HANDOFF_\(i)_PNG:"+data.base64EncodedString())
          }
          SWIFT
          swift frames.swift
      - uses: actions/upload-artifact@v4
        with:
          name: NightOwl-handoff-preview
          path: |
            previews/connected-handoff.mp4
            frames/*.png

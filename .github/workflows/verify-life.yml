name: Verify friendly interface
on:
  push:
    branches: [inspect-living-shop-3-1]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Wait for builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 40728448834 40728448897; do
            for attempt in {1..65}; do
              state=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$run --jq '.status' 2>/dev/null || echo retry)
              if [ "$state" = completed ]; then
                result=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$run --jq '.conclusion')
                test "$result" = success || exit 1
                break
              fi
              sleep 20
            done
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40728448834
          name: NightOwl-SideStore
          path: ipa
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40728448897
          name: NightOwl-character-screenshots
          path: previews
      - name: Verify IPA and interface screenshots
        run: |
          python3 - <<'PY'
          import zipfile, plistlib, struct, base64, subprocess
          z=zipfile.ZipFile('ipa/NightOwl.ipa')
          assert z.testzip() is None
          root='Payload/NightOwl.app/'
          info=plistlib.loads(z.read(root+'Info.plist'))
          assert info['CFBundleShortVersionString']=='4.1'
          assert info['CFBundleVersion']=='19'
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName']=='AppIcon'
          assert root+'Assets.car' in z.namelist()
          assert struct.unpack_from('<I',z.read(root+'NightOwl'),4)[0]==0x100000c
          print('PASS: IPA CRC, arm64 executable, version 4.1 build 19 and app icon',flush=True)
          for name in ['ui-more','ui-films','ui-returns','ui-shop','ui-checkout','ui-compact','ui-large']:
              subprocess.run(['sips','-Z','900','previews/'+name+'.png','--out',name+'-small.png'],check=True,stdout=subprocess.DEVNULL)
              print(name.upper().replace('-','_')+'_PNG:'+base64.b64encode(open(name+'-small.png','rb').read()).decode(),flush=True)
          PY

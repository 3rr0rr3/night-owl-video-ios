name: Inspect friendly release
on:
  push:
    paths: [.github/workflows/inspect-friendly.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-character-screenshots
          path: previews
          run-id: 40375626807
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-SideStore
          path: package
          run-id: 40375627285
          github-token: ${{ github.token }}
      - name: Verify IPA and previews
        run: |
          for NAME in world tutorial options styles summary; do
            sips -Z 800 previews/$NAME.png --out previews/$NAME-small.png >/dev/null
          done
          python3 - <<'PY'
          import zipfile,pathlib,plistlib,struct,base64
          z=zipfile.ZipFile('package/NightOwl.ipa')
          assert z.testzip() is None
          info=plistlib.loads(z.read('Payload/NightOwl.app/Info.plist'))
          b=z.read('Payload/NightOwl.app/NightOwl')
          assert struct.unpack_from('<II',b)==(0xfeedfacf,0x100000c)
          assert info['CFBundleShortVersionString']=='2.3'
          assert b'SceneKit.framework' not in b
          print('PASS: valid arm64 IPA version 2.3; illustrated game')
          for name in ['world','tutorial','options','styles','summary']:
              print(name.upper()+'_PNG:'+base64.b64encode(pathlib.Path('previews/'+name+'-small.png').read_bytes()).decode())
          PY

name: Inspect scanner and register release
on:
  push:
    paths: [.github/workflows/inspect-desk.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Wait for app and capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN in 40379968653 40379968940; do
            READY=0
            for N in {1..60}; do
              STATE=$(gh api repos/3rr0rr3/night-owl-video-ios/actions/runs/$RUN --jq '.status+" "+(.conclusion//"")' 2>/dev/null || true)
              if [ "$STATE" = "completed success" ]; then READY=1; break; fi
              case "$STATE" in "completed failure"|"completed cancelled") exit 1;; esac
              sleep 15
            done
            test "$READY" = 1
          done
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-character-screenshots
          path: previews
          run-id: 40379968940
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: NightOwl-SideStore
          path: package
          run-id: 40379968653
          github-token: ${{ github.token }}
      - name: Verify package and show captured animations
        run: |
          for NAME in barcode-scan cash-register rental-receipt; do
            sips -Z 800 previews/$NAME.png --out previews/$NAME-small.png >/dev/null
          done
          python3 - <<'PY'
          import zipfile,pathlib,plistlib,struct,base64
          z=zipfile.ZipFile('package/NightOwl.ipa')
          assert z.testzip() is None
          info=plistlib.loads(z.read('Payload/NightOwl.app/Info.plist'))
          b=z.read('Payload/NightOwl.app/NightOwl')
          assert struct.unpack_from('<II',b)==(0xfeedfacf,0x100000c)
          assert info['CFBundleShortVersionString']=='2.4'
          assert pathlib.Path('previews/store-animation.mp4').stat().st_size>100000
          print('PASS: valid arm64 IPA 2.4 and recorded simulator animation sequence')
          for name in ['barcode-scan','cash-register','rental-receipt']:
              print(name.upper().replace('-','_')+'_PNG:'+base64.b64encode(pathlib.Path('previews/'+name+'-small.png').read_bytes()).decode())
          PY
